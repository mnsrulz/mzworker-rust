syntax = "proto3";

package options;

service OptionsQueryService {
  rpc ExecuteQuery (ExecuteQueryRequest) returns (ExecuteQueryResponse);
}

message ExecuteQueryRequest {
  string query = 1;
  int32 limit = 2;
}

message ExecuteQueryResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
}

message Row {
  repeated Value values = 1;
}

message Value {
  oneof value {
    string string_val = 1;
    double double_val = 2;
    int64 int_val = 3;
    bool bool_val = 4;
  }
}
