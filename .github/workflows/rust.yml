name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Build with cross
        uses: dawidd6/action-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Verify
        run: |
          file target/${{ matrix.target }}/release/mzworker-rust

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mzworker-rust-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mzworker-rust